short_bio: >-
  <p>
    I am a first-year Master's student at <a href="https://www.sysu-hcp.net/" target="_blank">HCP Lab</a>, Sun Yat-sen University, advised by Prof. <a href="https://guanbinli.com/" target="_blank">Guanbin Li</a>. I received my B.E. from the School of Artificial Intelligence, Xidian University. Previously, I was a visiting student at <a href="https://en.westlake.edu.cn/faculty/yandong-wen.html" target="_blank">CLR Lab</a>, Westlake University, working with Prof. <a href="https://scholar.google.com/citations?user=HmylMfcAAAAJ&hl=en" target="_blank">Yandong Wen</a> on LLMs mathematical reasoning, and interned at Huawei <a href="https://www.huawei.com/en/giv/intelligent-automotive-solution-2030" target="_blank">IAS BU</a>, working with Yunfei Liu on driving video synthesis. I also closely collaborate with <a href="https://visionchengzhuo.github.io/" target="_blank">Chengzhuo Tong</a> and <a href="https://scholar.google.com/citations?user=MHo_d3YAAAAJ&hl=en" target="_blank">Bohan Zeng</a> from <a href="https://github.com/OpenDCAI" target="_blank">DCAI Group</a>, Peking University, on video world models.
  </p>
  <p>
    My current work focuses on <strong>Video Generation & World Models</strong>, with a special interest in real-time interactive and game-oriented video world models.
  </p>
  <blockquote class="about-connect-note">
    I am always happy to exchange ideas, learn from feedback, and explore possible collaborations with people in and beyond the field, feel free to reach out by email or WeChat!
  </blockquote>

