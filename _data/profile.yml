short_bio: >-
  <p>
    I am an incoming master's student at <a href="https://www.sysu-hcp.net/" target="_blank">HCP Lab</a>, Sun Yat-sen University, advised by Prof. <a href="https://guanbinli.com/" target="_blank">Guanbin Li</a>. Previously, I received my B.Eng. in Artificial Intelligence from Xidian University, and spent a memorable three months at Westlake University, where I was fortunate to work with Prof. <a href="https://scholar.google.com/citations?user=HmylMfcAAAAJ&hl=en" target="_blank">Yandong Wen</a>.
  </p>
  <p>
    My research interests lie in <strong>video generation</strong> and <strong>world models</strong>. I am especially interested in:
  </p>
  <ul>
    <li><em>Generative reasoning</em> : understanding the internal reasoning mechanisms of video models and large language models, and exploring how such abilities may generalize.</li>
    <li><em>Physical intelligence</em> : exploring how models can learn physical dynamics, spatial-temporal interactions, and actionable representations from real world data and simulation.</li>
  </ul>
  <p>
    I am still exploring these fields and always happy to learn from different perspectives. Please feel free to reach out if you would like to exchange ideas, discuss research, or explore possible collaborations.
  </p>

